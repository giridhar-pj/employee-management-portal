# Service = gives a stable address to reach the pods and spreads traffic between them
apiVersion: v1
kind: Service
metadata:
  name: employee-portal-service
spec:
  type: NodePort                  # opens a port on the Minikube node
  selector:
    app: employee-portal          # send traffic to pods with this label
  ports:
    - port: 80                    # Service port
      targetPort: 80              # container port
      nodePort: 30080             # port opened on the node
